<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="This is where you can contact us to arrange for trips">
    <meta name="author" content="Phinias O. Nyambita">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="address">
            <h1>Mountain View Rafting Company</h1>
            <p>P.O.Box 2299, Mango Street,</p>
            <P>Dar es Salaam, Tanzania</P>
            <p>+255 626 688 700</p>
            <p>Water@gmail.com</p>
        </div>

        <section class="details">
            <div class="google-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d506980.9389656632!2d39.07925829821863!3d-6.915861397925936!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1skigamboni%20dege%20beach!5e0!3m2!1sen!2stz!4v1786226487263!5m2!1sen!2stz"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="form">
                <label for="name">Name: </label>
                <input type="text" id="name" name="name" placeholder="John Doe">
                <label for="email">E-Mail: </label>
                <input type="text" id="email" name="email" placeholder="user@mail.com">
            </form>
            <radio class="radio">
                <p>Message Purpose</p>
                <label for="inquiry">General Inquiry</label>
                <input type="radio" id="inquiry" name="inquiry">
                <label for="reservation">Reservation Question</label>
                <input type="radio" id="reservation" name="inquiry">
                <label for="inquiry">Website Suggestion</label>
                <input type="radio" id="inquiry" name="inquiry">
            </radio>

        </section>

        <section class="employee">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/general-manager.jpg" alt="The General Manager">
                <figcaption>Mr. Paul V. Noun</figcaption>
                <figcaption>The General manager</figcaption>
            </figure>
            <figure>
                <img src="images/human-resource-manager.jpg" alt="Human Resource Manager">
                <figcaption>Mrs. Alicia P. Huber</figcaption>
                <figcaption>Human Resource Manager</figcaption>
            </figure>
            <figure>
                <img src="images/logistic-manager.jpg" alt="Logistic Manager">
                <figcaption>Mr. Anthony M. Mars</figcaption>
                <figcaption>Logistic Manager</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Mountain View Rafting Company | Phinias O. Nyambita</p>
        <nav class="social-media">
            <a href="https://www.facebook.com/" target="_blank">
                <img src="images/facebook.png" alt="facebook icon"></a>
            <a href="https://www.linkedin.com/login/" target="_blank">
                <img src="images/linkedin.png" alt="linkedin icon"></a>
            <a href="https://www.pinterest.com/">
                <img src="images/pinterest.png" alt="pinterest icon"></a>
        </nav>
    </footer>

</body>

</html>
